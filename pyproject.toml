[project]
name = "cog-neurosan-multiagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain-ollama>=1.1.0",
    "neuro-san-studio>=0.4.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The project root must come before site-packages, or the wheel's own coded_tools package shadows this repo's.
pythonpath = ["."]
markers = [
    "integration: runs a network end to end against the live LLM and MCP servers",
]
